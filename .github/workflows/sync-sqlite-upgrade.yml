name: Sync sqlite-upgrade with main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync main into sqlite-upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into sqlite-upgrade and push
        run: |
          git checkout sqlite-upgrade
          git merge origin/main --no-edit -m "chore(sync): auto-merge main into sqlite-upgrade"
          git push origin sqlite-upgrade
