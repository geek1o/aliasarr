name: Sync sqlite-upgrade with main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Sync main into sqlite-upgrade and Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into sqlite-upgrade and push
        id: merge
        run: |
          git checkout sqlite-upgrade
          git merge origin/main --no-edit -m "chore(sync): auto-merge main into sqlite-upgrade"
          git push origin sqlite-upgrade
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sqlite-upgrade Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:sqlite-upgrade
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ steps.merge.outputs.SHA }}
          build-args: |
            COMMIT_HASH=${{ steps.merge.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
